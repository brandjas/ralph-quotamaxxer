name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cmd/quotamaxxer/go.mod
      - name: Check formatting
        working-directory: cmd/quotamaxxer
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        working-directory: cmd/quotamaxxer
        run: go vet ./...
      - name: Go tests
        working-directory: cmd/quotamaxxer
        run: go test -race ./...
      - name: Install bats and jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Run bats tests
        run: bats test/
